apiVersion: apps/v1
kind: Deployment
metadata:
  name: nolcore-crawler
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: nolcore-crawler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nolcore-crawler}
    spec:
      containers:
        - name: crawler
          image: ghcr.io/noliae-france/nolcore-crawler:main
          ports: [{containerPort: 8091}]
          readinessProbe: {httpGet: {path: /api/health, port: 8091}}
          livenessProbe: {httpGet: {path: /api/health, port: 8091}}
---
apiVersion: v1
kind: Service
metadata: {name: nolcore-crawler}
spec:
  selector: {app.kubernetes.io/name: nolcore-crawler}
  ports: [{name: http, port: 8091, targetPort: 8091}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nolcore-ia
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: nolcore-ia}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nolcore-ia}
    spec:
      containers:
        - name: ia
          image: ghcr.io/noliae-france/nolcore-ia:main
          ports: [{containerPort: 8092}]
          envFrom:
            - secretRef: {name: nolcore-ia-secrets}
          readinessProbe: {httpGet: {path: /api/health, port: 8092}}
          livenessProbe: {httpGet: {path: /api/health, port: 8092}}
---
apiVersion: v1
kind: Service
metadata: {name: nolcore-ia}
spec:
  selector: {app.kubernetes.io/name: nolcore-ia}
  ports: [{name: http, port: 8092, targetPort: 8092}]
